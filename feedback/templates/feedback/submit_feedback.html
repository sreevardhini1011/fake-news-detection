{% extends 'base.html' %}

{% block title %}Submit Feedback{% endblock %}

{% block content %}
<div class="page-header fade-in-up">
    <h1>Submit Feedback</h1>
    <p>Help us improve our predictions</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="stat-card fade-in-up">
            <form method="post" class="form-custom">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Feedback Type</label>
                    {{ form.feedback_type }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    {{ form.user_rating }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Comments</label>
                    {{ form.comments }}
                </div>
                
                <button type="submit" class="btn btn-primary-custom btn-custom w-100">Submit Feedback</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
